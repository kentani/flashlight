name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.19 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test
        run: yarn test:ci
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Lint generated Service Worker
        run: yarn lint:pwa
      - name: Check static build
        run: yarn generate:check
      - name: Install Playwright Chromium
        run: yarn playwright install chromium chromium-headless-shell --with-deps
      - name: Check UI/UX in desktop and mobile Chromium
        run: yarn test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
